# Aplicar una vez en el clúster (AppProject "seguridad" ya existe):
#   oc apply -f bootstrap/applicationset-workshop-namespaces.yaml -n openshift-gitops
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workshop-namespaces
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/alexanderbenitezbracho-web/workshop-namespaces-argocd.git
        revision: v1
        directories:
          - path: overlays/*/*
          - path: overlays/*/env
            exclude: true
  template:
    metadata:
      name: 'ns-{{index .path.segments 1}}-{{.path.basename}}'
      labels:
        workshop.openshift.io/etapa: automatizacion-namespace
        workshop.openshift.io/entorno: '{{index .path.segments 1}}'
        workshop.openshift.io/proyecto: '{{.path.basename}}'
    spec:
      project: seguridad
      source:
        repoURL: https://github.com/alexanderbenitezbracho-web/workshop-namespaces-argocd.git
        targetRevision: v1
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 1}}-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
