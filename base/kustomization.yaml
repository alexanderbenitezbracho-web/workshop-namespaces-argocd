apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Recursos comunes a todos los namespaces del workshop.
# El nombre del namespace lo fija cada overlay (campo `namespace` + Namespace.yaml).
resources:
  - networkpolicy-deny-all-traffic.yaml
  - rolebinding-seguridad.yaml
  - clusterrole-base.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd
  workshop.openshift.io/etapa: automatizacion-namespace
