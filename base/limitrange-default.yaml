# Alineado con overlays/desarrollo/resourcequota.yaml (2 pods, 1 CPU request, 2 CPU limit, 500Mi/2Gi mem, 2Gi PVC).
# QA y producción usan limitrange propio en su overlay (cuotas distintas).
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-default-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 500m
        memory: 250Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 100m
        memory: 128Mi
    - type: Pod
      max:
        cpu: "2"
        memory: 2Gi
    - type: PersistentVolumeClaim
      max:
        storage: 2Gi
      min:
        storage: 500Mi
