apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Definición canónica de políticas de red del workshop (ver networkpolicy-deny-all-traffic.yaml).
# NetworkPolicy es namespaced: el despliegue real va en base/ (hard link) y se aplica en cada
# overlay vía ApplicationSet. No sincronizar esta ruta como Application de Argo hasta tener
# recursos cluster-scoped u otro mecanismo, si aplica.

resources: []

commonLabels:
  app.kubernetes.io/managed-by: argocd
  workshop.openshift.io/etapa: automatizacion-namespace
